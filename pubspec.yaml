name: food_app
description: "Hungry App is a food delivery app that allows users to order food from their favorite restaurants and have it delivered to their doorstep. With a user-friendly interface, real-time tracking, and a wide selection of cuisines, Hungry App makes it easy for users to satisfy their cravings anytime, anywhere."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_gap: ^1.2.0
  flutter_screenutil_plus: ^1.6.0
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  image_picker: ^1.2.3
  animate_icons: ^2.0.0
  lottie: ^3.5.1
  model_viewer_plus: ^1.10.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo/
    - assets/splash/
    - assets/test/
    - assets/detail/
    - assets/icon/
    - assets/banner/
    - assets/lottie/
    - assets/3dModel/
    - assets/appIcon/
    - assets/screenshots/

  # fonts:
